<!DOCTYPE html>
<!--
  Phase 7 page review, browser front end. Served by scripts/p7_web_review.py.
  The page holds the working state (instant toggles, live CSS preview of a
  geometry nudge) and mirrors every change to the server, which persists it
  to page_review.json; Save applies everything server-side with PIL — the
  CSS preview and the PIL render share the same rot/dx/dy semantics.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScanStudio — Page Review</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #0a0a0a; color: #e2e8f0; font: 13px/1.45 ui-monospace, Menlo, monospace;
         height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { background: #111; display: flex; align-items: center; gap: 14px;
           padding: 7px 12px; flex-wrap: wrap; }
  header .title { font-weight: bold; }
  #counter { color: #64748b; }
  #docs { color: #a855f7; font-size: 12px; }
  #savebtn { margin-left: auto; background: #3b82f6; color: #fff; border: 0;
             padding: 5px 12px; font: inherit; cursor: pointer; border-radius: 3px; }
  #finishbtn { background: #22c55e; color: #fff; border: 0;
               padding: 5px 12px; font: inherit; cursor: pointer; border-radius: 3px; }
  main { flex: 1 1 auto; display: flex; min-height: 0; flex-wrap: wrap; }
  #stage { flex: 1 1 480px; display: flex; flex-direction: column; min-width: 320px; min-height: 0; }
  #info { text-align: center; color: #64748b; padding: 4px 8px 2px; font-size: 12px; }
  #hud { text-align: center; color: #22ff66; font-size: 12px; min-height: 34px; white-space: pre-line; }
  #frame { flex: 1 1 auto; position: relative; margin: 2px 10px; min-height: 160px;
           display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #pagebox { position: relative; background: #fff; overflow: hidden; }
  #pagebox img { display: block; width: 100%; height: 100%; }
  #pagebox.docstart { outline: 3px solid #a855f7; }
  #dropband { position: absolute; inset: 0; border: 4px solid #ef4444; display: none;
              color: #ef4444; font-weight: bold; text-align: center; padding-top: 12px;
              font-size: 15px; background: rgba(120, 10, 10, .15); }
  #notewrap { padding: 2px 12px 8px; }
  #notelabel { font-size: 11px; color: #64748b; }
  #notelabel.doc { color: #a855f7; }
  #note { width: 100%; background: #111; color: #e2e8f0; border: 0; font: inherit;
          padding: 6px 8px; resize: none; height: 3.2em; }
  #panel { flex: 0 1 232px; background: #0f0f0f; padding: 10px 8px; min-width: 210px;
           display: flex; flex-direction: column; gap: 2px; }
  .btn { text-align: left; background: none; border: 0; color: #94a3b8; font: inherit;
         padding: 5px 8px; cursor: pointer; border-radius: 3px; white-space: pre; }
  .btn:hover { background: #16202e; }
  #hints { margin-top: auto; color: #475569; font-size: 11px; white-space: pre; padding: 10px 8px 4px; }
  @media (max-width: 760px) {
    main { flex-direction: column; }
    #panel { flex: 0 0 auto; flex-direction: row; flex-wrap: wrap; align-items: center; }
    #hints { margin: 0; flex-basis: 100%; }
  }
  #toast { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
           background: #1e293b; padding: 8px 16px; border-radius: 4px; display: none; z-index: 30; }
</style>
</head>
<body>
<header>
  <span class="title">Page Review</span>
  <span id="counter"></span>
  <span id="docs"></span>
  <button id="savebtn">Save (Ctrl+S)</button>
  <button id="finishbtn">Finish (Q)</button>
</header>
<main>
  <div id="stage">
    <div id="info"></div>
    <div id="hud"></div>
    <div id="frame">
      <div id="pagebox"><img id="pageimg" alt=""></div>
      <div id="dropband">DROPPED — x to undo</div>
    </div>
    <div id="notewrap">
      <div id="notelabel">note</div>
      <textarea id="note" rows="2"></textarea>
    </div>
  </div>
  <div id="panel">
    <button class="btn" id="b-prev">  A  ← Prev</button>
    <button class="btn" id="b-next">  D  Next →</button>
    <button class="btn" id="b-drop" style="color:#ef4444">  X  Drop page</button>
    <button class="btn" id="b-first" style="color:#a855f7">  F  First Page</button>
    <button class="btn" id="b-geom" style="color:#22ff66">  G  Geometry</button>
    <div id="hints">X Drop     F First Page
G Geometry (nudge page)
  arrows move · ⇧ 5×
  [ ] tilt · { } tilt 5×
  ⏎ keep · ⎋ cancel · ⌫ reset
←/A Prev   →/D Next
Ctrl+S Save   Q Finish
click the note box to type;
⎋ or ⇥ hands keys back</div>
  </div>
</main>
<div id="toast"></div>
<script>
"use strict";
const S = {
  pages: [], notes: {}, drops: new Set(), geometry: {}, docStarts: new Set(),
  cur: 0, geomMode: false, geomUndo: null,
};
const ROT_STEP = 0.25, ROT_COARSE = 1.25, PAN_STEP = 0.004, PAN_COARSE = 5;
const $ = (id) => document.getElementById(id);
const note = $("note");

const ws = new WebSocket(`ws://${location.host}/ws`);
ws.onmessage = (e) => onMsg(JSON.parse(e.data));
ws.onclose = () => toast("connection closed — restart the server and reload");
const send = (m) => { if (ws.readyState === 1) ws.send(JSON.stringify(m)); };

function onMsg(m) {
  if (m.type === "state") {
    S.pages = m.pages;
    S.notes = {}; for (const [k, v] of Object.entries(m.notes)) S.notes[+k] = v;
    S.drops = new Set(m.drops);
    S.geometry = {}; for (const [k, v] of Object.entries(m.geometry)) S.geometry[+k] = v;
    S.docStarts = new Set(m.doc_starts);
    S.cur = Math.max(0, Math.min(S.cur, S.pages.length - 1));
    show();
  } else if (m.type === "saved") {
    toast(`Saved — ${m.pages} pages, ${m.dropped} dropped, ${m.adjusted} adjusted, ${m.documents} document(s)`);
  } else if (m.type === "bye") {
    S.done = true;
    toast("Finished and saved — the server has moved on; close this tab");
  } else if (m.type === "error") {
    toast(m.message);
  }
}

function mirror() {
  send({
    type: "update",
    notes: Object.fromEntries(Object.entries(S.notes).map(([k, v]) => [String(k), v])),
    drops: [...S.drops],
    geometry: Object.fromEntries(Object.entries(S.geometry).map(([k, v]) => [String(k), v])),
    doc_starts: [...S.docStarts],
  });
}

const cur = () => S.pages[S.cur];
const geomOf = (pn) => S.geometry[pn] || { rot: 0, dx: 0, dy: 0 };
const isIdentity = (g) => !(g.rot || g.dx || g.dy);

function docPosition(idx) {
  let starts = S.pages.map((p, i) => (S.docStarts.has(p.page_num) ? i : -1)).filter((i) => i >= 0);
  if (!starts.length || starts[0] !== 0) starts = [0, ...starts];
  const docNo = starts.filter((s) => s <= idx).length;
  const within = idx - Math.max(...starts.filter((s) => s <= idx)) + 1;
  return [docNo, within, starts.length];
}

function show() {
  const pg = cur();
  if (!pg) { $("info").textContent = "No pages left."; return; }
  const pn = pg.page_num;
  const [docNo, within, nDocs] = docPosition(S.cur);
  const mark = S.cur === 0 ? "  ◆ FIRST PAGE (implicit)" : S.docStarts.has(pn) ? "  ◆ FIRST PAGE" : "";
  $("info").textContent = `Page ${pn} | ${pg.kind} | ${pg.filename}${mark}`;
  $("counter").textContent = `${S.cur + 1}/${S.pages.length}`;
  $("docs").textContent = nDocs > 1 ? `doc ${docNo}/${nDocs} · p${within}` : "";
  $("pagebox").classList.toggle("docstart", S.docStarts.has(pn));
  $("dropband").style.display = S.drops.has(pn) ? "block" : "none";

  const img = $("pageimg");
  img.onload = () => layout(img);
  img.src = `/page/${pg.filename}`;
  if (img.complete) layout(img);

  const g = geomOf(pn);
  if (S.geomMode) {
    $("hud").textContent =
      `GEOMETRY   tilt ${g.rot >= 0 ? "+" : ""}${g.rot.toFixed(2)}°   ` +
      `shift ${g.dx >= 0 ? "+" : ""}${g.dx.toFixed(3)}, ${g.dy >= 0 ? "+" : ""}${g.dy.toFixed(3)}\n` +
      "arrows move · ⇧arrows 5× · [ ] tilt · { } tilt 5× · ⏎ keep · ⎋ cancel · ⌫ reset";
  } else if (!isIdentity(g)) {
    $("hud").textContent = `adjusted ${g.rot >= 0 ? "+" : ""}${g.rot.toFixed(2)}° — G to edit`;
  } else {
    $("hud").textContent = "";
  }
  const lbl = $("notelabel");
  lbl.classList.toggle("doc", S.docStarts.has(pn));
  lbl.textContent = S.docStarts.has(pn)
    ? "◆ document title — type here to name this document's PDF" : "note";
  if (document.activeElement !== note) note.value = S.notes[pn] || "";
}

function layout(img) {
  const pg = cur();
  if (!pg || !img.naturalWidth) return;
  const fr = $("frame");
  const sc = Math.min(fr.clientWidth / img.naturalWidth, fr.clientHeight / img.naturalHeight, 1);
  const box = $("pagebox");
  box.style.width = `${img.naturalWidth * sc}px`;
  box.style.height = `${img.naturalHeight * sc}px`;
  // Same semantics as the PIL render: rotate CCW about the center, then
  // translate by fractions of the page's own size. CSS rotates clockwise
  // for positive angles, hence the sign flip.
  const g = geomOf(pg.page_num);
  img.style.transform =
    `translate(${g.dx * 100}%, ${g.dy * 100}%) rotate(${-g.rot}deg)`;
}
new ResizeObserver(() => layout($("pageimg"))).observe($("frame"));

// ── Edits ──────────────────────────────────────────────────

function toggleDrop() {
  const pn = cur().page_num;
  S.drops.has(pn) ? S.drops.delete(pn) : S.drops.add(pn);
  mirror();
  if (S.cur < S.pages.length - 1) S.cur++;   // auto-advance over blanks
  show();
}

function toggleDocStart() {
  if (S.cur === 0) return;                   // page 1 is implicit
  const pn = cur().page_num;
  S.docStarts.has(pn) ? S.docStarts.delete(pn) : S.docStarts.add(pn);
  mirror(); show();
}

function geomEdit(fn) {
  if (!S.geomMode) return;
  const pn = cur().page_num;
  const g = { ...geomOf(pn) };
  fn(g);
  S.geometry[pn] = g;
  show();
}

function toggleGeom() {
  if (S.geomMode) { geomConfirm(); return; }
  S.geomMode = true;
  S.geomUndo = { ...geomOf(cur().page_num) };
  note.blur();
  show();
}
function geomConfirm() {
  if (!S.geomMode) return;
  const pn = cur().page_num;
  if (isIdentity(geomOf(pn))) delete S.geometry[pn];
  S.geomMode = false; S.geomUndo = null;
  mirror(); show();
}
function geomCancel() {
  if (!S.geomMode) return;
  const pn = cur().page_num;
  if (S.geomUndo && !isIdentity(S.geomUndo)) S.geometry[pn] = S.geomUndo;
  else delete S.geometry[pn];
  S.geomMode = false; S.geomUndo = null;
  show();
}

function nav(d) {
  S.cur = Math.max(0, Math.min(S.cur + d, S.pages.length - 1));
  show();
}

// ── Note box: it owns the keyboard while focused ───────────

note.addEventListener("input", () => {
  const pn = cur().page_num;
  const t = note.value.trim();
  if (t) S.notes[pn] = t; else delete S.notes[pn];
});
note.addEventListener("blur", mirror);
note.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" || ev.key === "Tab") { ev.preventDefault(); note.blur(); show(); }
});
$("pageimg").addEventListener("click", () => note.blur());

// ── Keyboard ───────────────────────────────────────────────

document.addEventListener("keydown", (ev) => {
  if (S.done) return;
  if (document.activeElement === note) return;
  const k = ev.key;
  if ((ev.ctrlKey || ev.metaKey) && k.toLowerCase() === "s") {
    ev.preventDefault(); note.blur(); mirror(); send({ type: "save" }); return;
  }
  if (!S.geomMode && k.toLowerCase() === "q") {
    note.blur(); mirror(); send({ type: "finish" }); return;
  }
  if (S.geomMode) {
    if (k === "Enter") geomConfirm();
    else if (k === "Escape") geomCancel();
    else if (k.toLowerCase() === "g") geomConfirm();
    else if (k === "Backspace") { delete S.geometry[cur().page_num]; show(); }
    else if (k === "[") geomEdit((g) => (g.rot = +(g.rot + ROT_STEP).toFixed(3)));
    else if (k === "]") geomEdit((g) => (g.rot = +(g.rot - ROT_STEP).toFixed(3)));
    else if (k === "{") geomEdit((g) => (g.rot = +(g.rot + ROT_COARSE).toFixed(3)));
    else if (k === "}") geomEdit((g) => (g.rot = +(g.rot - ROT_COARSE).toFixed(3)));
    else if (k.startsWith("Arrow")) {
      ev.preventDefault();
      const step = PAN_STEP * (ev.shiftKey ? PAN_COARSE : 1);
      const dx = k === "ArrowLeft" ? -step : k === "ArrowRight" ? step : 0;
      const dy = k === "ArrowUp" ? -step : k === "ArrowDown" ? step : 0;
      geomEdit((g) => {
        g.dx = +Math.max(-0.5, Math.min(0.5, g.dx + dx)).toFixed(5);
        g.dy = +Math.max(-0.5, Math.min(0.5, g.dy + dy)).toFixed(5);
      });
    }
    return;
  }
  if (k === "ArrowRight" || k.toLowerCase() === "d") nav(1);
  else if (k === "ArrowLeft" || k.toLowerCase() === "a") nav(-1);
  else if (k.toLowerCase() === "x") toggleDrop();
  else if (k.toLowerCase() === "f") toggleDocStart();
  else if (k.toLowerCase() === "g") toggleGeom();
});

$("b-prev").onclick = () => nav(-1);
$("b-next").onclick = () => nav(1);
$("b-drop").onclick = toggleDrop;
$("b-first").onclick = toggleDocStart;
$("b-geom").onclick = toggleGeom;
$("savebtn").onclick = () => { note.blur(); mirror(); send({ type: "save" }); };
$("finishbtn").onclick = () => { note.blur(); mirror(); send({ type: "finish" }); };

let toastTimer = null;
function toast(text) {
  const t = $("toast");
  t.textContent = text;
  t.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.style.display = "none"), 3500);
}
</script>
</body>
</html>
