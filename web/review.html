<!DOCTYPE html>
<!--
  Phase 4 review, browser front end. Served by scripts/p4_web_review.py; all
  state lives in the server (the same semantics as the Tk review), this page
  renders frames + geometry and sends keys back over one WebSocket.

  Layout notes: the side panel wraps under the image on narrow screens
  (Chromebook effective resolutions) instead of clipping off-screen, and the
  key hints are always visible — the two Tk complaints this page exists for.
  The insert scrubber is a native <video> over /video (HTTP Range), so
  stepping frames is hardware-decoded and instant.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScanStudio — Review Keyframes</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #0a0a0a; color: #e2e8f0; font: 13px/1.45 ui-monospace, Menlo, monospace;
         height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { background: #111; display: flex; align-items: center; gap: 14px;
           padding: 7px 12px; flex: 0 0 auto; flex-wrap: wrap; }
  header .title { font-weight: bold; }
  #counter { color: #64748b; }
  #stats { color: #22c55e; font-size: 12px; }
  #queue { color: #f59e0b; font-size: 12px; }
  #savebtn { margin-left: auto; background: #3b82f6; color: #fff; border: 0;
             padding: 5px 12px; font: inherit; cursor: pointer; border-radius: 3px; }
  #finishbtn { background: #22c55e; color: #fff; border: 0;
               padding: 5px 12px; font: inherit; cursor: pointer; border-radius: 3px; }
  main { flex: 1 1 auto; display: flex; min-height: 0; flex-wrap: wrap; align-content: stretch; }
  #stage { flex: 1 1 480px; display: flex; flex-direction: column; min-width: 320px; min-height: 0; }
  #info { text-align: center; color: #64748b; padding: 4px 8px 0; font-size: 12px; }
  #detail { text-align: center; color: #64748b; padding: 0 8px 2px; font-size: 11px; }
  #wrap { flex: 1 1 auto; position: relative; min-height: 200px; margin: 4px 10px 8px; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; background: #111; }
  #panel { flex: 0 1 232px; background: #0f0f0f; padding: 10px 8px; overflow-y: auto;
           display: flex; flex-direction: column; gap: 2px; min-width: 210px; }
  #panel h4 { color: #64748b; font-size: 10px; padding: 2px 6px 4px; font-weight: normal; }
  .act { text-align: left; background: none; border: 0; color: #94a3b8; font: inherit;
         padding: 5px 8px; cursor: pointer; border-radius: 3px; white-space: pre; }
  .act:hover { background: #16202e; }
  .act.on { background: #1e293b; font-weight: bold; }
  #insertbtn { color: #3b82f6; }
  hr { border: 0; border-top: 1px solid #1e293b; margin: 7px 4px; }
  #curaction { color: #475569; font-size: 12px; padding: 6px 8px; font-weight: bold; }
  #hints { margin-top: auto; color: #475569; font-size: 11px; white-space: pre; padding: 10px 8px 4px; }
  /* On short/narrow screens the panel drops below the image and lays its
     buttons out in a row — everything stays reachable, nothing clips. */
  @media (max-width: 760px) {
    main { flex-direction: column; }
    #panel { flex: 0 0 auto; flex-direction: row; flex-wrap: wrap; align-items: center; }
    #hints { margin: 0; flex-basis: 100%; }
  }
  #scrub { position: fixed; inset: 0; background: rgba(4,4,4,.94); display: none;
           flex-direction: column; z-index: 20; padding: 10px 14px; gap: 8px; }
  #scrub.open { display: flex; }
  #scrubbar { display: flex; gap: 14px; align-items: center; }
  #scrubmotion { margin-left: auto; }
  #scrubvid { flex: 1 1 auto; min-height: 0; width: 100%; object-fit: contain; background: #000; }
  #scrubrange { width: 100%; }
  #scrubkeys { color: #475569; text-align: center; }
  #scrubgrab { background: #22c55e; color: #fff; border: 0; padding: 6px 18px;
               font: inherit; font-weight: bold; cursor: pointer; border-radius: 3px; }
  #toast { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
           background: #1e293b; padding: 8px 16px; border-radius: 4px; display: none; z-index: 30; }
</style>
</head>
<body>
<header>
  <span class="title">Review Keyframes</span>
  <span id="counter"></span>
  <span id="stats"></span>
  <span id="queue"></span>
  <button id="savebtn">Save (Ctrl+S)</button>
  <button id="finishbtn">Finish (Q)</button>
</header>
<main>
  <div id="stage">
    <div id="info"></div>
    <div id="detail"></div>
    <div id="wrap"><canvas id="cv"></canvas></div>
  </div>
  <div id="panel">
    <h4>ACTION</h4>
    <button class="act" data-a="keep">  1  Keep</button>
    <button class="act" data-a="dup">  2  Delete: Duplicate</button>
    <button class="act" data-a="occlusion">  3  Delete: Occlusion</button>
    <button class="act" data-a="other">  4  Delete: Other</button>
    <button class="act" data-a="cover">  5  Cover (no split)</button>
    <button class="act" data-a="doc_start">  6  Doc Start</button>
    <hr>
    <button class="act" id="insertbtn">  I  Insert Frame</button>
    <div id="curaction">(not reviewed)</div>
    <div id="hints"></div>
  </div>
</main>
<div id="scrub">
  <div id="scrubbar">
    <span>INSERT — find the missing frame</span>
    <span id="scrubinfo"></span>
    <span id="scrubmotion"></span>
    <button id="scrubgrab">✓ GRAB (⏎)</button>
  </div>
  <video id="scrubvid" preload="auto" muted></video>
  <input id="scrubrange" type="range" min="0" value="0" step="1">
  <div id="scrubkeys">←/→ ±1   ↑/↓ ±5   ⇧←/→ ±30   drag the slider to jump   ⏎ Grab   ⎋ Cancel</div>
</div>
<div id="toast"></div>
<script>
"use strict";
const ACT = {
  keep:      { color: "#22c55e", label: "Keep" },
  dup:       { color: "#f59e0b", label: "Delete: Duplicate" },
  occlusion: { color: "#ec4899", label: "Delete: Occlusion" },
  other:     { color: "#94a3b8", label: "Delete: Other" },
  cover:     { color: "#3b82f6", label: "Cover (no split)" },
  doc_start: { color: "#a855f7", label: "Doc Start" },
};
const KEY2ACT = { "1": "keep", "2": "dup", "3": "occlusion", "4": "other",
                  "5": "cover", "6": "doc_start" };

const S = {
  mode: "double", fps: 30, kfs: [], actions: {}, validated: new Set(),
  watch: {}, inserts: 0, cur: 0, geom: {},   // idx -> last 'frame' payload
  centerGuide: false, hasVideo: false, smoothed: [], frames: 0,
  ed: null,          // editor state or null
  scrubOpen: false, scrubFrame: 0,
  // scrubReady goes true only once the <video> reports its metadata. Until
  // then every position reads as frame 0, so Grab must not fire: that is
  // what silently inserted frame 0 when the recording's codec was one the
  // browser could not decode.
  scrubReady: false,
  proxy: { state: "none", pct: 0, message: "" },
};

const $ = (id) => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const imgCache = new Map();   // filename -> Image (bounded)

const ws = new WebSocket(`ws://${location.host}/ws`);
ws.onmessage = (e) => onMsg(JSON.parse(e.data));
ws.onclose = () => toast("connection closed — restart the server and reload");
const send = (m) => { if (ws.readyState === 1) ws.send(JSON.stringify(m)); };

function onMsg(m) {
  if (m.type === "state") {
    S.mode = m.mode; S.fps = m.fps; S.kfs = m.keyframes;
    S.actions = m.actions; S.validated = new Set(m.validated);
    S.inserts = m.inserts;
    S.watch = {};
    for (const [k, v] of Object.entries(m.watch)) S.watch[+k] = v;
    S.geom = {};
    S.cur = Math.min(S.cur, S.kfs.length - 1);
    hints(); show(S.cur);
  } else if (m.type === "signal") {
    S.hasVideo = m.video; S.smoothed = m.smoothed;
  } else if (m.type === "proxy") {
    const was = S.proxy.state;
    S.proxy = { state: m.state, pct: m.pct, message: m.message };
    S.frames = m.frames || S.frames;
    insertLabel();
    if (was === "building" && m.state === "ready") toast("Scrub proxy ready — Insert is live");
    if (m.state === "unavailable") toast(`Insert unavailable: ${m.message}`);
  } else if (m.type === "frame") {
    S.geom[m.idx] = m;
    if (m.idx === S.cur) render();
  } else if (m.type === "watch") {
    S.watch[m.idx] = m;
    queueLabel();
    if (m.idx === S.cur && !S.ed) { delete S.geom[S.cur]; show(S.cur); }
  } else if (m.type === "watch_done") {
    queueLabel(true);
  } else if (m.type === "seed") {
    openEditor(m);
  } else if (m.type === "inserted") {
    closeScrub(); S.cur = m.idx; show(S.cur);
    toast(`Inserted frame ${m.frame_index} (motion ${m.motion.toFixed(2)})`);
  } else if (m.type === "saved") {
    toast(`Saved — ${m.kept} keyframes, ${m.deleted} deleted`);
  } else if (m.type === "bye") {
    S.done = true;
    toast("Finished and saved — the server has moved on; close this tab");
  } else if (m.type === "notice") {
    toast(m.text);
  } else if (m.type === "error") {
    toast(m.message);
  }
}

// ── Navigation & frame display ─────────────────────────────

function show(idx) {
  if (!S.kfs.length) return;
  S.cur = Math.max(0, Math.min(idx, S.kfs.length - 1));
  if (!S.geom[S.cur]) send({ type: "show", idx: S.cur });
  render();
}

function image(name, cb) {
  let im = imgCache.get(name);
  if (im) { if (im.complete) cb(im); else im.addEventListener("load", () => cb(im), { once: true }); return; }
  im = new Image();
  im.src = `/img/${name}?v=1`;
  im.addEventListener("load", () => cb(im), { once: true });
  imgCache.set(name, im);
  if (imgCache.size > 10) imgCache.delete(imgCache.keys().next().value);
}

function fit() {
  const w = $("wrap");
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.max(1, Math.round(w.clientWidth * dpr));
  cv.height = Math.max(1, Math.round(w.clientHeight * dpr));
  render();
}
new ResizeObserver(fit).observe($("wrap"));

function dash(pat) { ctx.setLineDash(pat); }
const BOX_DASH = { manual: [], track: [8, 3], inherited: [8, 3] };

function render() {
  const kf = S.kfs[S.cur];
  if (!kf) { ctx.clearRect(0, 0, cv.width, cv.height); return; }
  header_();
  image(kf.filename, (im) => {
    if (S.kfs[S.cur] !== kf) return;              // navigated away meanwhile
    const W = cv.width, H = cv.height;
    ctx.clearRect(0, 0, W, H);
    const sc = Math.min(W / im.width, H / im.height);
    const dw = im.width * sc, dh = im.height * sc;
    const x0 = (W - dw) / 2, y0 = (H - dh) / 2;
    ctx.drawImage(im, x0, y0, dw, dh);

    const a = S.actions[S.cur];
    if (a && ACT[a]) {
      ctx.strokeStyle = ACT[a].color; ctx.lineWidth = 5; dash([]);
      ctx.strokeRect(x0 - 4, y0 - 4, dw + 8, dh + 8);
    }
    if (S.centerGuide) {
      ctx.strokeStyle = "#ff3333"; ctx.lineWidth = 1; dash([6, 4]);
      ctx.beginPath();
      ctx.moveTo(x0 + dw / 2, y0 + dh * 0.03);
      ctx.lineTo(x0 + dw / 2, y0 + dh * 0.97);
      ctx.stroke();
    }
    if (S.ed) { drawEditor(x0, y0, dw, dh); return; }

    const g = S.geom[S.cur] && S.geom[S.cur].geom;
    const isCover = a === "cover";
    if (g && !isCover) {
      ctx.strokeStyle = "#22ff66"; ctx.lineWidth = 2;
      dash(BOX_DASH[g.box_src] ?? [4, 4]);
      poly(g.box.map(([fx, fy]) => [x0 + fx * dw, y0 + fy * dh]));
      if (g.line) {
        const fr = S.geom[S.cur];
        dash(fr.gutter_own ? [] : fr.gutter_tracked ? [8, 3] : [4, 4]);
        const [[ax, ay], [bx, by]] = g.line;
        ctx.beginPath();
        ctx.moveTo(x0 + ax * dw, y0 + ay * dh);
        ctx.lineTo(x0 + bx * dw, y0 + by * dh);
        ctx.stroke();
      }
    }
    const w = S.watch[S.cur];
    if (w && w.flagged && !S.validated.has(S.cur) && !isCover) {
      const detail = w.measured
        ? `outline changed shape ~${Math.round(w.score)}px — more than a moving book explains`
        : "page boundary not measurable here";
      banner(`⚠ ${detail} — press G to check`, "#f59e0b", y0 + dh - 18);
    }
    dash([]);
  });
}

function poly(pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i <= pts.length; i++) ctx.lineTo(pts[i % pts.length][0], pts[i % pts.length][1]);
  ctx.stroke();
}

function banner(text, color, y) {
  ctx.fillStyle = color;
  ctx.font = `bold ${13 * (window.devicePixelRatio || 1)}px ui-monospace, monospace`;
  ctx.textAlign = "center";
  ctx.fillText(text, cv.width / 2, y);
}

function header_() {
  const kf = S.kfs[S.cur];
  $("counter").textContent = `${S.cur + 1} / ${S.kfs.length}`;
  const nDel = Object.values(S.actions).filter((a) => ["dup", "occlusion", "other"].includes(a)).length;
  $("stats").textContent = `Del:${nDel}  Ins:${S.inserts}`;
  const val = S.validated.has(S.cur) ? "  |  ✓ validated" : "";
  $("info").textContent = `Frame ${kf.frame_index} (${kf.time_sec.toFixed(1)}s)  |  ${kf.filename}`;
  $("detail").textContent =
    `Motion: ${(+kf.motion).toFixed(2)}  |  Sharp: ${Math.round(kf.sharpness)}  |  Src: ${kf.source}${val}`;
  const cur = S.actions[S.cur];
  document.querySelectorAll(".act[data-a]").forEach((b) => {
    const on = b.dataset.a === cur;
    b.classList.toggle("on", on);
    b.style.color = on ? ACT[b.dataset.a].color : "#94a3b8";
  });
  $("curaction").textContent = cur ? `→ ${ACT[cur].label}` : "(not reviewed)";
  $("curaction").style.color = cur ? ACT[cur].color : "#475569";
  queueLabel();
}

function flaggedRing() {
  return Object.entries(S.watch)
    .filter(([i, w]) => w.flagged && !S.validated.has(+i))
    .sort((a, b) => (a[1].measured === b[1].measured)
      ? b[1].score - a[1].score : (a[1].measured ? 1 : -1))
    .map(([i]) => +i);
}

let queueDone = false;
function queueLabel(done) {
  if (done !== undefined) queueDone = done;
  const n = flaggedRing().length;
  const scanned = Object.keys(S.watch).length;
  $("queue").textContent = !queueDone && S.mode === "double"
    ? `watchdog ${scanned}/${S.kfs.length}…${n ? ` ⚠${n}` : ""}`
    : n ? `⚠${n} to check (E)` : "";
}

function hints() {
  const split = S.mode === "double"
    ? "G Split    (crop box)\nE Next ⚠   (watchdog)\n"
    : "G Crop     (adjust box)\n";
  $("hints").textContent =
    "1 Keep ✓   2 Dup\n3 Occ      4 Other\n5 Cover    6 DocStart\n" +
    "I Insert   C Center\n" + split +
    "←/A Prev   →/D Next\nCtrl+S Save   Q Finish\n✓ = crop pinned as-is";
}

// ── Editor (split in double mode, crop in single) ──────────

function openEditor(seed) {
  const rect = rectFromQuad(seed.box.map(([fx, fy]) => [fx * seed.W, fy * seed.H]));
  S.ed = {
    idx: seed.idx, W: seed.W, H: seed.H, ...rect,
    gutter: seed.gutter, autoGutter: seed.auto_gutter,
    gutterSrc: seed.gutter_src, boxSrc: seed.box_src, dirty: false,
  };
  render();
}

function rectFromQuad(q) {
  const [tl, tr, br, bl] = q;
  const cx = (tl[0] + tr[0] + br[0] + bl[0]) / 4;
  const cy = (tl[1] + tr[1] + br[1] + bl[1]) / 4;
  const len = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1]);
  return {
    cx, cy,
    w: (len(tl, tr) + len(bl, br)) / 2,
    h: (len(tl, bl) + len(tr, br)) / 2,
    angle: Math.atan2(tr[1] - tl[1], tr[0] - tl[0]) * 180 / Math.PI,
  };
}

function quadFromRect(e) {
  const a = e.angle * Math.PI / 180;
  const ux = Math.cos(a), uy = Math.sin(a), vx = -Math.sin(a), vy = Math.cos(a);
  const hw = e.w / 2, hh = e.h / 2;
  return [
    [e.cx - hw * ux - hh * vx, e.cy - hw * uy - hh * vy],
    [e.cx + hw * ux - hh * vx, e.cy + hw * uy - hh * vy],
    [e.cx + hw * ux + hh * vx, e.cy + hw * uy + hh * vy],
    [e.cx - hw * ux + hh * vx, e.cy - hw * uy + hh * vy],
  ];
}

// Gutter lines pin to their raw-frame spot across box changes: the spine
// didn't move because the crop did (same trick as the Tk _apply_box_change).
function pointOfFrac(e, frac) {
  const a = e.angle * Math.PI / 180;
  const u = (frac - 0.5) * e.w;
  return [e.cx + u * Math.cos(a), e.cy + u * Math.sin(a)];
}
function fracOfPoint(e, pt) {
  const a = e.angle * Math.PI / 180;
  const u = (pt[0] - e.cx) * Math.cos(a) + (pt[1] - e.cy) * Math.sin(a);
  return Math.max(0.05, Math.min(0.95, u / Math.max(1e-6, e.w) + 0.5));
}
function mutateBox(fn) {
  const e = S.ed;
  const gPt = e.gutter !== null ? pointOfFrac(e, e.gutter) : null;
  const aPt = e.autoGutter !== null ? pointOfFrac(e, e.autoGutter) : null;
  fn(e);
  if (gPt) e.gutter = fracOfPoint(e, gPt);
  if (aPt) e.autoGutter = fracOfPoint(e, aPt);
  e.dirty = true; e.boxSrc = "manual";
  render();
}

function drawEditor(x0, y0, dw, dh) {
  const e = S.ed;
  const sc = dw / e.W;
  const toC = ([px, py]) => [x0 + px * sc, y0 + py * sc];
  const q = quadFromRect(e).map(toC);
  ctx.strokeStyle = "#22ff66"; ctx.lineWidth = 2; dash([]);
  poly(q);
  for (const [hx, hy] of q) {
    ctx.fillStyle = "#0a0a0a";
    ctx.fillRect(hx - 5, hy - 5, 10, 10);
    ctx.strokeRect(hx - 5, hy - 5, 10, 10);
  }
  if (S.mode === "double") {
    for (const [frac, wdt, pat] of [[e.autoGutter, 1, [3, 5]], [e.gutter, 2, []]]) {
      if (frac === null) continue;
      const [tl, tr, br, bl] = quadFromRect(e);
      const p1 = toC([tl[0] + frac * (tr[0] - tl[0]), tl[1] + frac * (tr[1] - tl[1])]);
      const p2 = toC([bl[0] + frac * (br[0] - bl[0]), bl[1] + frac * (br[1] - bl[1])]);
      ctx.lineWidth = wdt; dash(pat);
      ctx.beginPath(); ctx.moveTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]); ctx.stroke();
    }
  }
  dash([]);
  const head = S.mode === "double"
    ? `SPLIT   gutter ${e.gutter.toFixed(3)} (${e.gutterSrc})   box ${e.boxSrc}   tilt ${e.angle >= 0 ? "+" : ""}${e.angle.toFixed(2)}°`
    : `CROP   box ${e.boxSrc}   tilt ${e.angle >= 0 ? "+" : ""}${e.angle.toFixed(2)}°`;
  const keys = S.mode === "double"
    ? "arrows move · ⇧arrows resize · [ ] tilt · drag = gutter · ⇧drag = move · ⏎ save · ⎋ cancel · ⌫ reset"
    : "arrows move · ⇧arrows resize · [ ] tilt · drag corners · ⇧drag = move · ⏎ save · ⎋ cancel · ⌫ reset";
  banner(head, "#22ff66", y0 + 20 * (window.devicePixelRatio || 1));
  banner(keys, "#22ff66", y0 + 38 * (window.devicePixelRatio || 1));
}

function confirmEditor() {
  const e = S.ed;
  const q = quadFromRect(e).map(([x, y]) => [x / e.W, y / e.H]);
  send(S.mode === "double"
    ? { type: "confirm", idx: e.idx, gutter: e.gutter, box: q,
        box_dirty: e.dirty, rotation_deg: e.angle }
    : { type: "confirm", idx: e.idx, box: q });
  S.ed = null;
}

// ── Mouse ──────────────────────────────────────────────────

let drag = null;
cv.addEventListener("pointerdown", (ev) => {
  if (!S.ed) return;
  cv.setPointerCapture(ev.pointerId);
  const p = toFrame(ev);
  const e = S.ed;
  const corners = quadFromRect(e);
  const grab = 14 / (canvasScale() || 1);
  let k = -1;
  corners.forEach((c, i) => { if (Math.hypot(c[0] - p[0], c[1] - p[1]) < grab) k = i; });
  if (k >= 0) drag = { kind: "corner", k };
  else if (ev.shiftKey || S.mode === "single") drag = { kind: "move", last: p };
  else drag = { kind: "gutter" };
  onDrag(ev);
});
cv.addEventListener("pointermove", onDrag);
cv.addEventListener("pointerup", () => (drag = null));

function canvasScale() {
  const kf = S.kfs[S.cur], e = S.ed;
  if (!e) return 1;
  const dpr = window.devicePixelRatio || 1;
  return Math.min(cv.width / e.W, cv.height / e.H);
}
function toFrame(ev) {
  const r = cv.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const x = (ev.clientX - r.left) * dpr, y = (ev.clientY - r.top) * dpr;
  const e = S.ed;
  const sc = Math.min(cv.width / e.W, cv.height / e.H);
  const x0 = (cv.width - e.W * sc) / 2, y0 = (cv.height - e.H * sc) / 2;
  return [(x - x0) / sc, (y - y0) / sc];
}

function onDrag(ev) {
  if (!S.ed || !drag) return;
  const p = toFrame(ev);
  const e = S.ed;
  if (drag.kind === "gutter") {
    e.gutter = fracOfPoint(e, p);
    e.gutterSrc = "manual";
    render();
  } else if (drag.kind === "move") {
    const [lx, ly] = drag.last;
    drag.last = p;
    mutateBox((e) => {
      e.cx = Math.max(0, Math.min(e.W, e.cx + p[0] - lx));
      e.cy = Math.max(0, Math.min(e.H, e.cy + p[1] - ly));
    });
  } else if (drag.kind === "corner") {
    // Resize keeping the opposite corner pinned (Tk _drag_corner).
    mutateBox((e) => {
      const q = quadFromRect(e);
      const [ox, oy] = q[(drag.k + 2) % 4];
      const a = e.angle * Math.PI / 180;
      const ux = Math.cos(a), uy = Math.sin(a), vx = -Math.sin(a), vy = Math.cos(a);
      const du = (p[0] - ox) * ux + (p[1] - oy) * uy;
      const dv = (p[0] - ox) * vx + (p[1] - oy) * vy;
      const su = drag.k === 0 || drag.k === 3 ? -1 : 1;
      const sv = drag.k === 0 || drag.k === 1 ? -1 : 1;
      const w = Math.max(0.05 * e.W, su * du);
      const h = Math.max(0.05 * e.H, sv * dv);
      e.cx = ox + (su * w / 2) * ux + (sv * h / 2) * vx;
      e.cy = oy + (su * w / 2) * uy + (sv * h / 2) * vy;
      e.w = w; e.h = h;
    });
  }
}

// ── Keyboard ───────────────────────────────────────────────

document.addEventListener("keydown", (ev) => {
  if (S.done) return;
  if (S.scrubOpen) { scrubKeys(ev); return; }
  const k = ev.key;
  if ((ev.ctrlKey || ev.metaKey) && k.toLowerCase() === "s") {
    ev.preventDefault(); send({ type: "save" }); return;
  }
  if (!S.ed && k.toLowerCase() === "q") { send({ type: "finish" }); return; }
  if (S.ed) {
    if (k === "Enter") confirmEditor();
    else if (k === "Escape" || k.toLowerCase() === "g") S.ed = null, render();
    else if (k === "Backspace") send({ type: "reset_geom", idx: S.ed.idx });
    else if (k === "[") mutateBox((e) => (e.angle -= 0.25));
    else if (k === "]") mutateBox((e) => (e.angle += 0.25));
    else if (k.startsWith("Arrow")) {
      ev.preventDefault();
      const d = k.slice(5).toLowerCase();
      if (ev.shiftKey) mutateBox((e) => {
        if (d === "left") e.w = Math.max(0.05 * e.W, e.w - 0.01 * e.W);
        if (d === "right") e.w = Math.min(1.5 * e.W, e.w + 0.01 * e.W);
        if (d === "up") e.h = Math.min(1.5 * e.H, e.h + 0.01 * e.H);
        if (d === "down") e.h = Math.max(0.05 * e.H, e.h - 0.01 * e.H);
      });
      else mutateBox((e) => {
        e.cx = Math.max(0, Math.min(e.W, e.cx + (d === "left" ? -1 : d === "right" ? 1 : 0) * 0.004 * e.W));
        e.cy = Math.max(0, Math.min(e.H, e.cy + (d === "up" ? -1 : d === "down" ? 1 : 0) * 0.004 * e.H));
      });
    }
    return;
  }
  if (KEY2ACT[k]) send({ type: "action", idx: S.cur, action: KEY2ACT[k] });
  else if (k === "ArrowRight" || k.toLowerCase() === "d") show(S.cur + 1);
  else if (k === "ArrowLeft" || k.toLowerCase() === "a") show(S.cur - 1);
  else if (k.toLowerCase() === "g") send({ type: "seed", idx: S.cur });
  else if (k.toLowerCase() === "c") { S.centerGuide = !S.centerGuide; render(); }
  else if (k.toLowerCase() === "i") openScrub();
  else if (k.toLowerCase() === "e") {
    const ring = flaggedRing();
    if (ring.length) {
      const after = ring.filter((i) => i > S.cur);
      show(after.length ? after[0] : ring[0]);
    } else toast("nothing flagged");
  }
});

document.querySelectorAll(".act[data-a]").forEach((b) =>
  b.addEventListener("click", () => send({ type: "action", idx: S.cur, action: b.dataset.a })));
$("insertbtn").addEventListener("click", openScrub);
$("savebtn").addEventListener("click", () => send({ type: "save" }));
$("finishbtn").addEventListener("click", () => send({ type: "finish" }));

// ── Insert scrubber: a native <video>, hardware decode ─────

const vid = $("scrubvid"), range = $("scrubrange");

function insertLabel() {
  const p = S.proxy;
  $("insertbtn").textContent =
    p.state === "building" ? `  I  Insert Frame (proxy ${p.pct}%)`
    : p.state === "unavailable" ? "  I  Insert Frame (unavailable)"
    : "  I  Insert Frame";
}

function openScrub() {
  if (!S.hasVideo) { toast("no recording available for insert"); return; }
  // The recording's codec isn't one the browser can play, so the server is
  // transcoding a proxy to scrub. Opening now would show a black panel with
  // a dead slider — say so instead.
  if (S.proxy.state === "building") {
    toast(`Preparing the scrub proxy — ${S.proxy.pct}%. Insert works once it lands.`);
    return;
  }
  if (S.proxy.state === "unavailable") { toast(`Insert unavailable: ${S.proxy.message}`); return; }
  S.scrubOpen = true;
  S.scrubReady = false;
  $("scrub").classList.add("open");
  $("scrubinfo").textContent = "loading the recording…";
  if (!vid.src) vid.src = "/video";
  const start = S.kfs[S.cur] ? S.kfs[S.cur].frame_index : 0;
  const ready = () => {
    // The server's frame count is authoritative; vid.duration is the
    // fallback for a recording it could not probe.
    range.max = S.frames ? S.frames - 1
                         : Math.max(0, Math.round(vid.duration * S.fps) - 1);
    S.scrubReady = true;
    setScrubFrame(start);
  };
  if (vid.readyState >= 1) ready();
  else vid.addEventListener("loadedmetadata", ready, { once: true });
}
vid.addEventListener("error", () => {
  if (!S.scrubOpen) return;
  const e = vid.error;
  closeScrub();
  toast(`The browser cannot play this recording (${e ? e.message || e.code : "media error"}) — `
        + "use `make review` for inserts");
});
function closeScrub() {
  S.scrubOpen = false;
  S.scrubReady = false;
  $("scrub").classList.remove("open");
  vid.pause();
}
function setScrubFrame(f) {
  if (!S.scrubReady) return;      // no timeline yet: every f would clamp to 0
  f = Math.max(0, Math.min(f, +range.max || 0));
  S.scrubFrame = f;
  vid.currentTime = (f + 0.5) / S.fps;
  range.value = f;
  $("scrubinfo").textContent = `Frame ${f}  |  ${(f / S.fps).toFixed(2)}s`;
  const m = S.smoothed[Math.min(f, S.smoothed.length - 1)] ?? 0;
  const col = m < 2 ? "#22c55e" : m < 4 ? "#f59e0b" : "#ef4444";
  $("scrubmotion").textContent = `Motion: ${m.toFixed(2)}`;
  $("scrubmotion").style.color = col;
}
range.addEventListener("input", () => setScrubFrame(+range.value));
$("scrubgrab").addEventListener("click", grab);
function grab() {
  if (!S.scrubReady) { toast("the recording hasn't loaded — nothing to grab yet"); return; }
  send({ type: "insert", frame_index: S.scrubFrame });
}
function scrubKeys(ev) {
  const step = ev.shiftKey ? 30 : 1;
  if (ev.key === "ArrowRight") setScrubFrame(S.scrubFrame + step);
  else if (ev.key === "ArrowLeft") setScrubFrame(S.scrubFrame - step);
  else if (ev.key === "ArrowUp") setScrubFrame(S.scrubFrame + 5);
  else if (ev.key === "ArrowDown") setScrubFrame(S.scrubFrame - 5);
  else if (ev.key === "Enter") grab();
  else if (ev.key === "Escape") closeScrub();
  else return;
  ev.preventDefault();
}

// ── Misc ───────────────────────────────────────────────────

let toastTimer = null;
function toast(text) {
  const t = $("toast");
  t.textContent = text;
  t.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.style.display = "none"), 3500);
}
</script>
</body>
</html>
